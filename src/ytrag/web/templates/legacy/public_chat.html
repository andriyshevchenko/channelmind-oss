<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>{{ bot_name or "Channelmind bot" }}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: #0a0a0e; font-family: 'Instrument Sans', system-ui, sans-serif; -webkit-font-smoothing: antialiased; color: #e5e5ea; }
  a { color: #a5b4fc; text-decoration: none; }
  a:hover { color: #c7d2fe; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .4; } }
  #cmInput:focus { border-color: #6366f1 !important; box-shadow: 0 0 0 3px rgba(99,102,241,.15); }
</style>
</head>
<body>
<div style="min-height: 100vh; background: radial-gradient(700px 400px at 50% -10%, rgba(99,102,241,.08), transparent), #0a0a0e; color: #e5e5ea; display: flex; flex-direction: column; align-items: center; padding: 32px 24px; box-sizing: border-box;">
  <div style="width: 100%; max-width: 680px; flex: 1; display: flex; flex-direction: column; gap: 16px;">
    <div style="display: flex; align-items: center; gap: 12px; padding-bottom: 16px; border-bottom: 1px solid #1e1e28;">
      {% if bot_avatar %}
      <img src="{{ bot_avatar }}" alt="" referrerpolicy="no-referrer" style="width: 40px; height: 40px; border-radius: 9999px; object-fit: cover; flex-shrink: 0;">
      {% else %}
      <div style="width: 40px; height: 40px; border-radius: 9999px; background: linear-gradient(135deg, #f59e0b, #ef4444); display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700; color: #fff; flex-shrink: 0;">{{ (bot_name or "?")[0] | upper }}</div>
      {% endif %}
      <div style="display: flex; flex-direction: column; gap: 1px; min-width: 0;">
        <span style="font-size: 16px; font-weight: 700; letter-spacing: -.01em;">{{ bot_name or "Channelmind bot" }}</span>
        <span style="font-size: 12px; color: #8a8a99;">{{ source_summary or "Answers grounded in the channel's videos, with citations." }}</span>
      </div>
    </div>
    <div id="cmMessages" style="flex: 1; display: flex; flex-direction: column; gap: 14px; overflow-y: auto; padding: 8px 0;">
      <div id="cmEmpty" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; padding: 48px 20px;">
        <div style="width: 44px; height: 44px; border-radius: 13px; background: linear-gradient(135deg, rgba(244,63,94,.15), rgba(99,102,241,.15)); border: 1px solid #26262f; display: flex; align-items: center; justify-content: center;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#a5b4fc" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
        </div>
        <span style="font-size: 13.5px; color: #8a8a99; max-width: 300px; line-height: 1.5;">Ask anything — answers cite the sources they come from.</span>
      </div>
    </div>
    <div style="display: flex; gap: 8px;">
      <input id="cmInput" placeholder="Ask {{ bot_name or 'this bot' }}…" style="flex: 1; height: 44px; box-sizing: border-box; padding: 0 14px; border-radius: 8px; border: 1px solid #2c2c3a; background: #101016; color: #e5e5ea; font-family: inherit; font-size: 13.5px; outline: none;">
      <button id="cmSend" style="height: 44px; box-sizing: border-box; padding: 0 20px; border-radius: 8px; border: none; cursor: pointer; font-family: inherit; font-size: 13.5px; font-weight: 600; color: #fff; background: linear-gradient(135deg, #f43f5e, #6366f1); box-shadow: 0 4px 20px rgba(99,102,241,.25);">Send</button>
    </div>
    <a href="/about" style="align-self: center; display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: #5a5a6a;">
      <span style="width: 12px; height: 12px; border-radius: 4px; background: linear-gradient(135deg, #f43f5e, #6366f1); display: inline-block;"></span>
      Powered by Channelmind
    </a>
  </div>
</div>
<script>
// TOKEN is the private-share credential. When present, the send button posts to
// the token-scoped guest endpoint; when null (e.g. the legacy /p/{id} shell) the
// page stays inert and tells the visitor to ask the owner for a link.
var TOKEN = {{ (token or none) | tojson }};
(function(){
  var input=document.getElementById('cmInput');
  var send=document.getElementById('cmSend');
  var msgs=document.getElementById('cmMessages');
  var empty=document.getElementById('cmEmpty');
  var HIST=[];

  function esc(s){ return (s||'').replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

  // Only http(s) links become active anchors — a javascript:/data: url from a
  // source is rendered as plain text instead of a clickable scheme.
  function safeUrl(u){ u=(u||'').trim(); return /^https?:\/\//i.test(u) ? u : ''; }

  function bubble(who, text){
    var wrap=document.createElement('div');
    wrap.style.cssText='display:flex; flex-direction:column; gap:4px; align-items:'+(who==='You'?'flex-end':'flex-start')+';';
    var label=document.createElement('span');
    label.style.cssText='font-size:10.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:#5a5a6a;';
    label.textContent=who;
    var body=document.createElement('div');
    body.style.cssText='max-width:85%; padding:11px 15px; border-radius:12px; background:'+(who==='You'?'#1c1c2a':'#101016')+'; border:1px solid '+(who==='You'?'#2c2c3a':'#1e1e28')+'; font-size:13.5px; line-height:1.55; white-space:pre-wrap;';
    body.textContent=text;
    wrap.appendChild(label); wrap.appendChild(body);
    msgs.appendChild(wrap);
    msgs.scrollTop=msgs.scrollHeight;
    return {wrap: wrap, body: body};
  }

  function addSources(wrap, sources){
    if(!sources || !sources.length) return;
    var src=document.createElement('div');
    src.style.cssText='font-size:11px; color:#5a5a6a; margin-top:2px;';
    src.innerHTML='Sources: ' + sources.map(function(s){
      var t=esc(s.title||'source');
      var u=safeUrl(s.url);
      return u ? '<a href="'+esc(u)+'" target="_blank" rel="noopener">'+t+'</a>' : t;
    }).join(' · ');
    wrap.appendChild(src);
  }

  function submit(){
    var q=input.value.trim();
    if(!q) return;
    if(empty){ empty.remove(); empty=null; }
    bubble('You', q);
    input.value='';
    if(!TOKEN){
      bubble('Assistant', "This link isn't active. Ask the bot's owner for a share link.");
      return;
    }
    send.disabled=true;
    var thinking=bubble('Assistant', '…');
    thinking.body.style.animation='pulse 1.2s ease-in-out infinite';
    fetch('/api/s/'+encodeURIComponent(TOKEN)+'/chat', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({message:q, history:HIST})
    }).then(function(r){ return r.json().then(function(d){ return {ok:r.ok, d:d}; }); })
      .then(function(res){
        thinking.wrap.remove();
        if(!res.ok || res.d.error){
          bubble('Assistant', res.d && res.d.error ? res.d.error : 'Something went wrong. Please try again.');
        } else {
          var b=bubble('Assistant', res.d.answer || '');
          addSources(b.wrap, res.d.sources);
          HIST.push({role:'user', content:q});
          HIST.push({role:'assistant', content:res.d.answer || ''});
          if(HIST.length>20) HIST=HIST.slice(-20);
        }
        send.disabled=false;
      }).catch(function(){
        thinking.wrap.remove();
        bubble('Assistant', 'Request failed. Check your connection and try again.');
        send.disabled=false;
      });
  }
  send.addEventListener('click', submit);
  input.addEventListener('keydown', function(e){ if(e.key==='Enter') submit(); });
})();
</script>
</body>
</html>
