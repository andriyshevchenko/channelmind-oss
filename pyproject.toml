[project]
name = "channelmind"
version = "0.1.0"
description = "Self-hostable, whole-YouTube-channel RAG chat — index a channel's transcripts and chat with an AI grounded in them, with citations and timecodes."
requires-python = ">=3.11"
dependencies = [
    "yt-dlp>=2026.3.17",
    "anthropic>=0.40",
    "openai>=1.40",
    "voyageai>=0.3",
    "chromadb>=0.5",
    "typer>=0.12",
    "rich>=13.7",
    "python-dotenv>=1.0",
    "webvtt-py>=0.5",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "mcp>=1.2,<2",
    "authlib>=1.3",
    "itsdangerous>=2.1",
    "telegramify-markdown>=1.2",
    "cryptography>=42",
]

[project.scripts]
ytrag = "ytrag.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ytrag.web" = ["templates/*.html", "static/*", "spa/**/*"]
